# Evaluation config for the internal benchmark (see BENCHMARK.md).
# Override any value with a CLI flag on run_eval.py.

# ---------- frame sampling ----------
sample_every: 10          # CLIP/temporal: sample 1 frame every N (set 0 to use `sample_n`)
sample_n: 0               # if >0, sample this many evenly-spaced frames instead of `sample_every`
vlm_keyframes: 8          # VLM judge: number of evenly-spaced keyframes (8-10 recommended)

# ---------- models ----------
clip_model: ViT-B/32                      # OpenAI CLIP variant (clip.load)
dino_model: dinov2_vits14                 # torch.hub facebookresearch/dinov2
vlm_model: gemini-2.5-flash               # google-genai model id (configurable)

# ---------- final-score weights (must sum to 1.0) ----------
weights:
  clip: 0.3               # CLIP score (normalized, see clip_norm)
  temporal: 0.2           # temporal consistency
  dino: 0.2               # DINO score
  vlm: 0.3                # VLM judge overall (normalized /10)

# CLIP raw cosine similarity is small (~0.18-0.35). Normalize linearly into 0-1
# before weighting:  norm = clamp((raw - lo) / (hi - lo), 0, 1)
clip_norm:
  lo: 0.15
  hi: 0.35
