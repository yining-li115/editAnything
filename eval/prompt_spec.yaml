# Benchmark prompt spec — 30 videos × 3 difficulty tiers (easy / medium / hard).
#
# Tier definitions:
#   easy   = same category, near-identical silhouette, photoreal   (baseline fidelity + relight)
#   medium = different object, different silhouette, photoreal      (shape change -> shadow recast + edge reblend)
#   hard   = large style/material/identity shift, often non-natural (style match + physical-plausibility limit)
#
# Per video:
#   source        : SAM3 noun for the OLD object to remove (must be segmentable in the clip)
#   scene         : scene/lighting descriptor, appended to every target to form the long `prompt`
#   failure_mode  : the scene's primary stress (shadow | reflection | occlusion | motion | sky | large) — for analysis
#   easy/medium/hard:
#       target       : short new-object description (drives Gemini ref0 + CLIP + VLM)
#       target_word  : SAM3 noun for the NEW object on ref0 (concrete & segmentable!)
#
# The generator builds:  prompt = "{target}, {scene}"   and one config per (video, tier).
# EDIT FREELY before we generate ref0s.

videos:

  cup0:
    source: cup
    scene: "on a glossy pale-pink round table, smooth reflective tabletop, soft studio light, plain blue wall"
    failure_mode: reflection
    easy:   { target: "a white ceramic mug", target_word: "mug" }
    medium: { target: "a ripe yellow banana", target_word: "banana" }
    hard:   { target: "a glowing cyan cyberpunk orb", target_word: "orb" }

