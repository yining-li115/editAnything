# editAnything pipeline config.
#   Run:  cd editAnything && python pipeline.py --config config.yaml
# Any CLI flag overrides the value here. Comment a line out to fall back to the
# built-in default. Paths may be absolute or relative to where you run the command.

# ---------- input ----------  (see input/README.txt)
video: input/cup2_low.mp4                  # source clip (300 frames)
# frames_dir: outputs/_shared100/frames_src  # or point at pre-extracted frames (quick tests)

# ---------- what to replace ----------
source: cup                               # OLD object to remove (SAM3 noun)
target: a ripe yellow banana              # NEW object (short description)
target_word: banana                       # NEW object noun for SAM3 on ref0 (blank -> uses `target`)
prompt: "a ripe yellow banana resting on a glossy dark round table, a hand with a ring on the table, smooth reflective tabletop, soft natural light, pale blue-grey wall"

name: cup2_rose            # outputs -> editAnything/outputs/cup2_rose/

# ---------- anchors + edit region ----------
backend: roma                             # roma (general) | assets (use prepared anchors+masks)
ref0: input/replacement.png               # (roma) frame-0 reference: new object on frame 0
# ref0_mask:                              # (roma) optional precomputed frame-0 target mask (else SAM3)
# assets:                                 # (assets) dir containing anchors/ and banana_masks/
# mask_mode: union                        # (assets only) union | source | target

# ---------- generation ----------
generator: videopainter                   # ROUTE: videopainter (CogVideoX video model, temporally
                                          #   smooth) | mvinpainter (multi-view image model, separate
                                          #   env/subprocess; per-chunk reanchor fill). Both consume
                                          #   the same masks + ref0.
anchor_backend: roma                      # per-chunk anchor source (orthogonal to generator):
                                          #   roma = warp ref0 (cheap, shears at large views) |
                                          #   mvinpainter = single-mode pass (clean at all views).
                                          #   The 2x2: {roma|mvinpainter} x {videopainter|mvinpainter}.
                                          #   Recommended: roma+videopainter (static/small motion),
                                          #   mvinpainter+mvinpainter (large viewpoint change).
mvi_chunk: 20                             # (generator=mvinpainter) consecutive frames per chunk
mvi_nframe: 24                            # (generator=mvinpainter) sampled anchor views (<=32 PE cap)
# segment_starts: [0, 48]                 # blank -> auto from frame count (every 48 + tail)
dilate: 12                                # edit-region margin (px), applied to the final mask
source_mask: track                        # track -> warped (target∪source) seed PLUS per-frame SAM3 source,
                                          #   then dilate (default; closes the moving-source leak while the
                                          #   generous seed keeps the new object from dissolving)
                                          # warp  -> legacy: warped seed only (leaks a moving/occluded source)
region_shape: rect                        # shape of the warped seed: rect (rotated quad) | hull (tight) | bbox
steps: 15                                 # denoise steps; 15 holds quality on a 40GB card (10 also ok on static scenes)
guidance: 6.0
seed: 42
offload: model                            # VideoPainter VRAM/speed: model (~35GB, ~2.4x faster than sequential, fits 40GB)
                                          #   | sequential (~22GB, slow, any card) | none (~44GB, needs 80GB)
                                          # (overrides $VP_OFFLOAD; comment out to fall back to the env var)

# ---------- post-processing / output ----------
removal: rose                             # rose -> ROSE clean-plate removal of source object + shadow,
                                          #   then composite new object onto it; none -> off
rose_steps: 25                            # ROSE denoise steps (only when removal=rose); lower = faster
                                          #   removal (50 -> ~84s denoise; try 25/15/10). Quality: see sweep.
out_size: 480x832                         # WxH; blank -> native frame size
fps: 25
interpolate: true                         # RIFE anchor de-spike (smooth segment boundaries)
no_composite: false                       # (only matters when removal=none; roma skips composite anyway)

